services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      # Port host 5173 dipetakan ke Nginx port 80.
      # Origin browser tetap http://localhost:5173, jadi CORS di backend tidak perlu diubah.
      - "5173:80"
    restart: unless-stopped
